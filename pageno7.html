<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Untold Story of Samosa</title>
    <style>
        /* Modern student application workspace styling */
        body {
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f2fa 0%, #e8e3f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Unified app container mimicking a school tablet reading view */
        .container {
            background-color: #ffffff;
            max-width: 650px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(75, 44, 109, 0.06);
            border: 1px solid rgba(75, 44, 109, 0.04);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* School purple top decorative bar */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #4b2c6d, #ff7f50);
        }

        /* Chapter / Lesson Header Badge */
        .lesson-title {
            display: inline-block;
            background-color: #f0ebf7;
            color: #4b2c6d;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 30px;
            margin-bottom: 15px;
        }

        /* Deep colored heading */
        h1 {
            font-size: 2.2rem;
            color: #4b2c6d;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        /* Clean, readable typography layout for reading practice */
        p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #444444;
            text-align: left; /* Swapped justify for cleaner student reading flow */
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Text emphasis styling */
        strong {
            color: #ff7f50;
            font-weight: 800;
            display: block;
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        /* Responsive assignment graphic layout */
        .story-img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 35px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Animated Interactive Action Pill Button */
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #ff7f50, #ff5722);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(255, 127, 80, 0.3);
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* Tactile interactive animation physics */
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 127, 80, 0.45);
            background: linear-gradient(135deg, #ff9166, #ff5722);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Structured Upper Progress Badge -->
        <div class="lesson-title">Lesson No 2 📖</div>
        
       
        
        <!-- Main Content Area formatted for easy word recognition -->
       
        
        <!-- Assignment Picture Graphic Component -->
        <img src="MARATHI.jpg" alt="jeevan" class="story-img">
        
        <!-- Upgraded Dynamic Navigation Action Button -->
        <div>
            <a href="pageno8.html" class="cta-button">See Your Score 🏆</a>
        </div>
    </div>
   
       




</body>
</html>
