<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Reading Practice Record</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        .header {
            color: #4a3b8c;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .congrats {
            color: #2b2b2b;
            font-size: 1.8rem;
            margin: 10px 0;
        }
        .subtext {
            color: #666;
            font-size: 1rem;
            margin-bottom: 25px;
        }
        .score-box {
            background-color: #5d4dbd;
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .score-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .score-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
        }
        .score-footer {
            font-size: 0.9rem;
            font-weight: bold;
        }
        .table-title {
            text-align: left;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
        }
        th {
            background-color: #f9f9f9;
            color: #555;
        }
        .status-completed {
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header Text -->
        <div class="header">Reading Practice Record</div>
        <h1 class="congrats">Congratulations!</h1>
        <p class="subtext">You completed today's reading practice.</p>

        <!-- Score Badge -->
        <div class="score-box">
            <div class="score-label">Your score</div>
<style>
  .flower-img {
    width: 30%;
    height: 50;
     align:left;
  }
</style>
<img src="flower.jpeg" alt="flower" class="flower-img">     
       <div class="score-value">10/ 10</div>
            <div class="score-footer">✨ Keep reading every day!</div>
        </div>

        <!-- Practice Record Table -->
        <div class="table-title">Your daily practice record</div>
        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Language</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>English</td>
                    <td class="status-completed">Completed</td>
                </tr>
                <tr>
                    <td>Tuesday</td>
                    <td>English</td>
                    <td class="status-completed">Completed</td>
                </tr>
                <tr>
                    <td>Wednesday</td>
                    <td>Hindi</td>
                    <td class="status-completed">Completed</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
